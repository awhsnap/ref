# Tests every push and pull request; deploys main to fly.io.
# Needs the repository secret FLY_API_TOKEN. Optional repository variable
# FLY_ORG picks the fly.io organization for the first deploy (default: personal).
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
    steps:
      - name: Check the fly.io token is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add a repository secret named FLY_API_TOKEN (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read app settings from fly.toml
        run: |
          echo "APP=$(sed -n 's/^app *= *"\(.*\)"/\1/p' fly.toml)" >> "$GITHUB_ENV"
          echo "REGION=$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' fly.toml)" >> "$GITHUB_ENV"

      - name: Create the app and its database volume (first deploy only)
        run: |
          if ! flyctl status -a "$APP" > /dev/null 2>&1; then
            flyctl apps create "$APP" --org "$FLY_ORG"
          fi
          if ! flyctl volumes list -a "$APP" | grep -q ref_data; then
            flyctl volumes create ref_data --size 1 --region "$REGION" -a "$APP" --yes
          fi

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false -a "$APP"

      - name: Check the live site
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://$APP.fly.dev/api/auth/config"
          echo
          echo "Live at https://$APP.fly.dev"
